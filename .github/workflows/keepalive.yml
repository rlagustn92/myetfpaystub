# 앱이 잠들지 않게 규칙적으로 한 번 찔러 줍니다.
#
# 왜 필요한가
# -----------
# Streamlit Community Cloud 는 **12시간 동안 아무도 안 들어오면 앱을 재웁니다**
# (공식 문서: "All apps without traffic for 12 hours go to sleep").
# 자고 있는 앱에 들어오면 "Zzzz" 화면이 뜨고, 깨우는 버튼을 눌러야 하며,
# 깨어나는 데 1분쯤 걸립니다. 처음 온 사람에게는 그냥 **고장 난 서비스**입니다.
#
# ⚠ 잠든 앱을 이걸로 깨울 수는 없습니다. 깨우기는 사람이 버튼을 눌러야 합니다.
#   이건 **잠들지 않게 막는 것**이라, 앱이 깨어 있는 동안 켜 두어야 합니다.
#
# 부담이 거의 없는 이유
# ---------------------
# 주소를 그냥 GET 하면 **HTML 껍데기만** 옵니다. Streamlit 은 브라우저가
# 웹소켓을 연결할 때 비로소 app.py 를 돌리므로, 이 찌르기로는 **시세도 분배금도
# 조회되지 않습니다.** 운용사·yfinance 쪽으로 나가는 호출은 0 입니다.
#
# 4시간마다(하루 6번) 도는 이유
# ------------------------------
# 12시간 안에만 들어오면 되지만, GitHub Actions 의 예약 실행은 **정시에 안 돕니다.**
# 몇십 분씩 밀리고 바쁠 때는 아예 건너뛰기도 합니다. 6시간으로 잡으면 한 번
# 걸렀을 때 12시간에 딱 걸리므로, 한 번쯤 빠져도 괜찮게 4시간으로 둡니다.
#
# ⚠ GitHub 은 **60일 동안 커밋이 없는 저장소의 예약 작업을 자동으로 끕니다.**
#   오래 손 놓았다가 앱이 다시 자기 시작하면 이걸 의심하세요
#   (Actions 탭에서 다시 켜거나, 아래 "Run workflow" 로 수동 실행하면 됩니다).

name: keepalive

on:
  schedule:
    - cron: "0 */4 * * *"      # UTC 기준 4시간마다
  workflow_dispatch:            # Actions 탭에서 손으로도 돌릴 수 있게

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 앱 주소를 한 번 부릅니다
        run: |
          # ⚠ **쿠키를 받아 두고 리다이렉트를 따라가야** 합니다.
          #   Streamlit Cloud 는 첫 요청을 인증용 주소로 한 번 돌리는데,
          #   쿠키를 안 저장하면 같은 자리를 맴돌다 실패합니다
          #   (실측: 쿠키 없이 -L 만 주면 "50 redirects" 로 죽습니다).
          code=$(curl -sSL --max-redirs 10 \
                      -c cookies.txt -b cookies.txt \
                      -o /dev/null -w "%{http_code}" \
                      --max-time 60 \
                      https://myetfpaystub.streamlit.app)
          echo "HTTP $code"
          # 200 이 아니면 실패로 남깁니다. 앱이 죽었으면 여기서 먼저 압니다.
          test "$code" = "200"
